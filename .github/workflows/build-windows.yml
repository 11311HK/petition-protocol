name: build-windows-exe

# 청원 게임의 Windows 실행 파일(.exe)을 빌드해 아티팩트로 올린다.
# WinForms 는 Windows 에서만 빌드되므로 windows 러너를 사용한다.

on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "PetitionGame/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}   # 수동 실행 가능

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: |
          dotnet publish PetitionGame/PetitionGame.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o publish

      - name: List output
        shell: pwsh
        run: Get-ChildItem -Recurse publish | Select-Object FullName, Length

      - name: Upload exe + assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetitionGame-win-x64
          path: publish/**
          if-no-files-found: error
